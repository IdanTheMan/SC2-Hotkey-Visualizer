<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC2 Hotkey Visualizer — Category Highlights</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #06060e;
            --sf: #0c0c1a;
            --sf2: #141428;
            --kb: #181832;
            --kb-b: #28284a;
            --kb-h: #222244;
            --tx: #b8b8d4;
            --tx-d: #5a5a7a;
            --tx-b: #e8e8f8;
            --ac: #00e5ff;
            --u: 44px;
            --g: 3px;
            --r: 4px;
        }
        html,
        body {
            height: 100%;
            margin: 0;
        }
        body {
            background: var(--bg);
            background-image: linear-gradient(rgba(0, 229, 255, .012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, .012) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--tx);
            font-family: 'Share Tech Mono', monospace;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 229, 255, .08);
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--tx-b);
            letter-spacing: 3px;
        }
        .header h1 .a {
            color: var(--ac);
            text-shadow: 0 0 20px rgba(0, 229, 255, .4);
        }
        .sub {
            font-size: 9px;
            color: var(--tx-d);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .stats {
            display: flex;
            gap: 14px;
        }
        .stat {
            text-align: center;
        }
        .stat-v {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--ac);
        }
        .stat-l {
            font-size: 8px;
            color: var(--tx-d);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 8px 0 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            margin-bottom: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        .search {
            padding: 5px 10px;
            background: var(--sf2);
            border: 1px solid var(--kb-b);
            border-radius: 3px;
            color: var(--tx);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            outline: none;
            width: 180px;
            transition: border-color .2s;
        }
        .search:focus {
            border-color: var(--ac);
        }
        .search::placeholder {
            color: var(--tx-d);
        }
        .btn {
            padding: 4px 10px;
            background: var(--sf2);
            border: 1px solid var(--kb-b);
            border-radius: 3px;
            color: var(--tx-d);
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            cursor: pointer;
            transition: all .2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .btn:hover {
            border-color: var(--ac);
            color: var(--ac);
        }
        .btn.active {
            border-color: var(--ac);
            color: var(--ac);
            background: rgba(0, 229, 255, .06);
        }
        .filter-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 8px;
            color: var(--tx-d);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 2px;
        }
        .filters {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .filter {
            padding: 3px 7px;
            background: var(--sf2);
            border: 1px solid var(--kb-b);
            border-radius: 10px;
            font-size: 9px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--tx-d);
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .filter .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .filter:hover {
            border-color: var(--tx-d);
        }
        .filter.on {
            border-color: var(--tx);
            color: var(--tx);
            background: rgba(255, 255, 255, .03);
        }
        .filter.off {
            opacity: .3;
        }
        .melee-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--tx-d);
            cursor: pointer;
            padding: 3px 8px;
            border: 1px solid var(--kb-b);
            border-radius: 10px;
            background: var(--sf2);
            transition: all .2s;
            user-select: none;
            flex-shrink: 0;
        }
        .melee-toggle:hover {
            border-color: var(--tx-d);
        }
        .melee-toggle.active {
            border-color: var(--ac);
            color: var(--ac);
            background: rgba(0, 229, 255, .06);
        }
        .melee-toggle .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--tx-d);
            transition: all .2s;
        }
        .melee-toggle.active .indicator {
            background: var(--ac);
            box-shadow: 0 0 8px rgba(0, 229, 255, .4);
        }

        .category-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            align-items: center;
            padding: 4px 0 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .category-bar .cat-label {
            font-size: 8px;
            color: var(--tx-d);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 2px;
        }
        .cat-toggle {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border: 1px solid var(--kb-b);
            background: var(--sf2);
            color: var(--tx-d);
            cursor: pointer;
            transition: all .2s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .cat-toggle .cat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .cat-toggle:hover {
            border-color: var(--tx-d);
        }
        .cat-toggle.active {
            border-color: var(--ac);
            color: var(--tx-b);
            background: rgba(255, 255, 255, .04);
        }
        .cat-toggle.active .cat-dot {
            box-shadow: 0 0 6px currentColor;
        }
        .cat-clear {
            font-size: 8px;
            color: var(--tx-d);
            cursor: pointer;
            padding: 2px 6px;
            border: 1px solid transparent;
            border-radius: 10px;
            transition: all .2s;
        }
        .cat-clear:hover {
            border-color: var(--tx-d);
            color: var(--tx);
        }

        .colorize-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--tx-d);
            cursor: pointer;
            padding: 3px 8px;
            border: 1px solid var(--kb-b);
            border-radius: 10px;
            background: var(--sf2);
            transition: all .2s;
            user-select: none;
            flex-shrink: 0;
        }
        .colorize-toggle:hover {
            border-color: var(--tx-d);
        }
        .colorize-toggle.active {
            border-color: var(--ac);
            color: var(--ac);
            background: rgba(0, 229, 255, .06);
        }
        .colorize-toggle .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--tx-d);
            transition: all .2s;
        }
        .colorize-toggle.active .indicator {
            background: var(--ac);
            box-shadow: 0 0 8px rgba(0, 229, 255, .4);
        }

        /* ─── Key combo search bar ─── */
        .combo-search-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .combo-search-wrapper .combo-label {
            font-size: 8px;
            color: var(--tx-d);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #comboSearch {
            padding: 4px 8px;
            background: var(--sf2);
            border: 1px solid var(--kb-b);
            border-radius: 3px;
            color: var(--tx);
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            outline: none;
            width: 140px;
            transition: border-color .2s;
        }
        #comboSearch:focus {
            border-color: var(--ac);
        }
        #comboSearch::placeholder {
            color: var(--tx-d);
            font-size: 9px;
        }
        .combo-clear {
            font-size: 9px;
            color: var(--tx-d);
            cursor: pointer;
            padding: 2px 6px;
            border: 1px solid transparent;
            border-radius: 10px;
            transition: all .2s;
        }
        .combo-clear:hover {
            border-color: var(--tx-d);
            color: var(--tx);
        }

        .main-panel {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 12px;
            padding-bottom: 6px;
        }
        .kb-sec {
            flex: 0 0 55%;
            min-width: 380px;
            overflow-x: auto;
            overflow-y: auto;
            padding-right: 6px;
            border-right: 1px solid rgba(255, 255, 255, .05);
        }
        .kb-sec .kb {
            display: flex;
            flex-direction: column;
            gap: var(--g);
            min-width: fit-content;
        }
        .kb-sec .krow {
            display: flex;
            gap: var(--g);
        }
        .kb-sec .kgap {
            width: calc(var(--u)*.45);
            flex-shrink: 0;
        }
        .kb-sec .key {
            height: var(--u);
            background: var(--kb);
            border: 1px solid var(--kb-b);
            border-radius: var(--r);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .15s ease;
            position: relative;
            flex-shrink: 0;
            user-select: none;
            overflow: hidden;
        }
        .kb-sec .key::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--r);
            pointer-events: none;
            transition: all .2s;
        }
        .kb-sec .key:hover {
            background: var(--kb-h);
            border-color: rgba(0, 229, 255, .25);
        }
        .kb-sec .key.has::after {
            background: rgba(0, 229, 255, .035);
        }
        .kb-sec .key.glow {
            border-color: var(--gc, var(--ac));
            box-shadow: 0 0 14px var(--gc4, rgba(0, 229, 255, .3)), inset 0 0 8px var(--gc2, rgba(0, 229, 255, .12));
            transform: translateY(-2px);
            z-index: 10;
        }
        .kb-sec .key.glow::after {
            background: var(--gc2, rgba(0, 229, 255, .12));
        }
        .kb-sec .key.glow .kl {
            color: #fff;
            text-shadow: 0 0 6px var(--gc, var(--ac));
        }
        .kb-sec .kl {
            font-size: 10px;
            font-weight: 700;
            color: var(--tx);
            z-index: 1;
            pointer-events: none;
            line-height: 1;
        }
        .kb-sec .key.has .kl {
            color: var(--tx-b);
        }
        .kb-sec .kc {
            font-size: 7px;
            color: var(--tx-d);
            z-index: 1;
            pointer-events: none;
            margin-top: 1px;
            min-height: 9px;
        }
        .kb-sec .key.has .kc {
            color: var(--ac);
        }
        .kb-sec .mrow {
            display: flex;
            gap: var(--g);
            margin-top: 6px;
        }
        .kb-sec .mrow .key {
            height: calc(var(--u)*.68);
        }

        .cmds {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            min-width: 0;
        }
        .cmds .race-sec {
            background: var(--sf);
            border: 1px solid rgba(255, 255, 255, .04);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .cmds .race-hdr {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background .15s;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            user-select: none;
        }
        .cmds .race-hdr:hover {
            background: rgba(255, 255, 255, .02);
        }
        .cmds .race-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .cmds .race-nm {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--tx-b);
            letter-spacing: 3px;
            text-transform: uppercase;
            flex: 1;
        }
        .cmds .race-cnt {
            font-size: 10px;
            color: var(--tx-d);
            margin-right: 4px;
        }
        .cmds .race-arr {
            font-size: 8px;
            color: var(--tx-d);
            transition: transform .3s;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .cmds .race-sec.shut .race-arr {
            transform: rotate(-90deg);
        }
        .cmds .race-body {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows .3s;
        }
        .cmds .race-sec.shut .race-body {
            grid-template-rows: 0fr;
        }
        .cmds .race-inner {
            overflow: hidden;
        }
        .cmds .sub-sec {
            margin: 4px 6px;
            border: 1px solid rgba(255, 255, 255, .03);
            border-radius: 4px;
            overflow: hidden;
        }
        .cmds .sub-hdr {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            cursor: pointer;
            transition: background .15s;
            user-select: none;
        }
        .cmds .sub-hdr:hover {
            background: rgba(255, 255, 255, .02);
        }
        .cmds .sub-nm {
            font-size: 10px;
            font-weight: 700;
            color: var(--tx);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex: 1;
        }
        .cmds .sub-cnt {
            font-size: 9px;
            color: var(--tx-d);
        }
        .cmds .sub-arr {
            font-size: 7px;
            color: var(--tx-d);
            transition: transform .3s;
        }
        .cmds .sub-sec.shut .sub-arr {
            transform: rotate(-90deg);
        }
        .cmds .sub-body {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows .3s;
        }
        .cmds .sub-sec.shut .sub-body {
            grid-template-rows: 0fr;
        }
        .cmds .sub-inner {
            overflow: hidden;
        }
        .cmds .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1px;
            padding: 3px;
        }
        .cmds .cmd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 7px;
            border-radius: 3px;
            cursor: pointer;
            transition: background .12s, border-color .2s;
            gap: 6px;
            border-left: 2px solid transparent;
        }
        .cmds .cmd:hover {
            background: rgba(255, 255, 255, .04);
        }
        .cmds .cmd.pin {
            background: rgba(255, 255, 255, .06);
            outline: 1px solid rgba(255, 255, 255, .08);
        }
        .cmds .cmd.cat-highlight {
            border-left-color: var(--cat-color, var(--ac));
            background: rgba(255, 255, 255, .03);
        }
        .cmds .cmd-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .cmds .cmd-nm {
            font-size: 11px;
            color: var(--tx-b);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmds .cmd-ctx {
            font-size: 9px;
            color: var(--tx-d);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cmds .cmd-keys {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .cmds kbd {
            display: inline-block;
            padding: 1px 5px;
            background: var(--kb);
            border: 1px solid var(--kb-b);
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: var(--tx-b);
            min-width: 16px;
            text-align: center;
            line-height: 1.4;
        }
        .cmds .cmd:hover kbd {
            border-color: var(--ac);
            color: var(--ac);
        }
        .cmds .cmd.pin kbd {
            border-color: var(--ac);
            color: var(--ac);
        }
        /* combo search highlight */
        .cmds .cmd.combo-match {
            background: rgba(0, 229, 255, .08);
            outline: 1px solid rgba(0, 229, 255, .2);
        }
        .cmds .cmd.combo-match kbd {
            border-color: var(--ac);
            color: var(--ac);
        }

        .tip {
            position: fixed;
            background: var(--sf);
            border: 1px solid var(--ac);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 10px;
            color: var(--tx);
            pointer-events: none;
            z-index: 1000;
            max-width: 340px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .6);
            display: none;
        }
        .tip-k {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--ac);
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(0, 229, 255, .1);
        }
        .tip-r {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            margin-bottom: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }
        .tip-c {
            padding: 1px 0;
            color: var(--tx);
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .tip-c .tc {
            color: var(--tx-d);
            font-size: 9px;
            white-space: nowrap;
        }
        .tip-c .cat-chip {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
            margin-right: 4px;
            vertical-align: middle;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--sf);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--kb-b);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--tx-d);
        }

        @media(max-width: 900px) {
            :root {
                --u: 34px;
            }
            .main-panel {
                flex-direction: column;
                gap: 10px;
            }
            .kb-sec {
                flex: 0 0 auto;
                min-width: 0;
                width: 100%;
                border-right: none;
                max-height: 45vh;
                overflow-y: auto;
            }
            .cmds {
                flex: 1;
                max-height: 55vh;
                overflow-y: auto;
            }
            .cmds .cmd-grid {
                grid-template-columns: 1fr;
            }
            .toolbar {
                gap: 6px;
            }
            #comboSearch {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
            <div>
                <h1>SC2 <span class="a">HOTKEY</span> MAP</h1>
                <p class="sub">Hover to highlight · Category filters available</p>
            </div>
            <div class="stats">
                <div class="stat"><span class="stat-v" id="sT">-</span><span class="stat-l">Bindings</span></div>
                <div class="stat"><span class="stat-v" id="sK">-</span><span class="stat-l">Keys</span></div>
                <div class="stat"><span class="stat-v" id="sA">-</span><span class="stat-l">Actions</span></div>
            </div>
        </header>

        <div class="toolbar">
            <input type="text" id="search" class="search" placeholder="Search commands..." />
            <button class="btn" id="toggleAll">Collapse All</button>
            <div class="filter-bar">
                <span class="filter-label">Race</span>
                <div class="filters" id="raceFilters"></div>
            </div>
            <div class="melee-toggle active" id="meleeToggle">
                <span class="indicator"></span>
                Melee Only
            </div>
            <div class="colorize-toggle active" id="colorizeToggle">
                <span class="indicator"></span>
                Colorize
            </div>
            <div class="combo-search-wrapper">
                <span class="combo-label">Key:</span>
                <input type="text" id="comboSearch" placeholder="e.g. Shift+1" />
                <span class="combo-clear" id="comboClear">✕</span>
            </div>
        </div>

        <div class="category-bar" id="categoryBar">
            <span class="cat-label">Highlight:</span>
            <span class="cat-clear" id="clearCategories">✕ clear</span>
        </div>

        <div class="main-panel">
            <div class="kb-sec">
                <div class="kb" id="kb"></div>
                <div class="mrow" id="mrow"></div>
            </div>
            <div class="cmds" id="cmds"></div>
        </div>

        <div class="tip" id="tip"></div>
    </div>

        function parse() {
            const binds = [];
            let sec = '';
            for (const ln of CFG.split('\n')) {
                const t = ln.trim();
                if (!t || t.startsWith(';')) continue;
                const sm = t.match(/^\[(.+)\]$/);
                if (sm) { sec = sm[1].toLowerCase(); continue; }
                const kv = t.match(/^(.+?)=(.*)$/);
                if (!kv) continue;
                const act = kv[1].trim(),
                    val = kv[2].trim();
                if (sec === 'settings' || !val) continue;
                for (const c of val.split(',')) {
                    const cc = c.trim();
                    if (!cc) continue;
                    const pts = cc.split('+').map(s => s.trim());
                    const kn = pts[pts.length - 1],
                        mods = pts.slice(0, -1),
                        kid = nk(kn);
                    const parts = act.split('/'),
                        base = parts[0],
                        ctx = parts.slice(1).join('/');
                    const [race, sub] = classify(act, ctx, sec);
                    const melee = isMelee(act, ctx, sec);
                    let hkCat = null;
                    if (sec === 'hotkeys') hkCat = getHotkeyCategory(act);
                    binds.push({ action: base, raw: act, sec, keyId: kid, mods, combo: cc, race, sub, name: fmt(
                            base), ctx, melee, hkCat });
                }
            }
            return binds;
        }

            KM = {};

            for (const b of binds) {
                if (!KM[b.keyId]) KM[b.keyId] = [];
                KM[b.keyId].push(b);
                if (!AG[b.raw]) AG[b.raw] = { action: b.action, raw: b.raw, name: b.name, race: b.race, sub: b.sub,
                    ctx: b.ctx, kbs: [], ks: new Set, melee: b.melee, hkCat: b.hkCat };
                const g = AG[b.raw];
                if (!g.ks.has(b.combo)) { g.ks.add(b.combo);
                    g.kbs.push({ combo: b.combo, keyId: b.keyId, mods: b.mods }); }
            }
        }

            const kb = document.getElementById('kb');

            for (const row of KB_ROWS) {

                rd.className = 'krow';
                for (const it of row) {
                    if (!it) { const g = document.createElement('div');
                        g.className = 'kgap';
                        rd.appendChild(g); continue; }
                    rd.appendChild(mkKey(it));
                }
                kb.appendChild(rd);
            }
            const mr = document.getElementById('mrow');
            mr.innerHTML = '';
            for (const it of M_KEYS) {
                if (!it) { const g = document.createElement('div');
                    g.className = 'kgap';
                    mr.appendChild(g); continue; }
                mr.appendChild(mkKey(it));
            }
        }

        function mkKey(it) {
            const el = document.createElement('div');
            el.className = 'key';
            el.dataset.key = it.id;
            el.style.width = `calc(var(--u)*${it.w})`;
            const n = (KM[it.id] || []).length;
            if (n) el.classList.add('has');
            el.innerHTML = `<span class="kl">${it.l}</span><span class="kc">${n||''}</span>`;
            el.addEventListener('mouseenter', e => showTip(it.id, e));
            el.addEventListener('mouseleave', hideTip);
            return el;
        }

            cm.innerHTML = '';
            const groups = {};
            for (const g of Object.values(AG)) {
                if (meleeOnly && !g.melee) continue;
                if (!groups[g.race]) groups[g.race] = {};
                if (!groups[g.race][g.sub]) groups[g.race][g.sub] = [];
                groups[g.race][g.sub].push(g);
            }
            for (const race of RACES) {
                const rd = groups[race.id];
                if (!rd) continue;
                let total = 0;
                for (const items of Object.values(rd)) total += items.length;
                if (total === 0) continue;
                const sec = document.createElement('div');
                sec.className = 'race-sec';
                sec.dataset.race = race.id;
                if (allCollapsed) sec.classList.add('shut');
                const hdr = document.createElement('div');
                hdr.className = 'race-hdr';
                hdr.innerHTML =
                    `<span class="race-dot" style="background:${race.c}"></span><span class="race-nm">${race.n}</span><span class="race-cnt">${total}</span><span class="race-arr">▾</span>`;
                hdr.onclick = () => sec.classList.toggle('shut');
                sec.appendChild(hdr);
                const body = document.createElement('div');
                body.className = 'race-body';
                const inner = document.createElement('div');
                inner.className = 'race-inner';
                for (const sub of SUBS[race.id] || []) {
                    const items = rd[sub];
                    if (!items || !items.length) continue;
                    items.sort((a, b) => a.name.localeCompare(b.name));
                    const ss = document.createElement('div');
                    ss.className = 'sub-sec';
                    if (allCollapsed) ss.classList.add('shut');
                    const sh = document.createElement('div');
                    sh.className = 'sub-hdr';
                    sh.innerHTML =
                        `<span class="sub-nm">${sub}</span><span class="sub-cnt">${items.length}</span><span class="sub-arr">▾</span>`;
                    sh.onclick = () => ss.classList.toggle('shut');
                    ss.appendChild(sh);
                    const sb = document.createElement('div');
                    sb.className = 'sub-body';
                    const si = document.createElement('div');
                    si.className = 'sub-inner';
                    const grid = document.createElement('div');
                    grid.className = 'cmd-grid';
                    for (const item of items) {
                        const el = document.createElement('div');
                        el.className = 'cmd';
                        el.dataset.raw = item.raw;
                        el.dataset.search = `${item.name} ${item.ctx}`.toLowerCase();
                        // combo filter match
                        let comboMatch = false;
                        if (comboFilter) {
                            const normalizedFilter = comboFilter.toLowerCase().replace(/\s/g, '');
                            for (const kb of item.kbs) {
                                const comboStr = [...kb.mods, kb.keyId].join('+').toLowerCase().replace(/\s/g, '');
                                if (comboStr === normalizedFilter || comboStr.includes(normalizedFilter)) {
                                    comboMatch = true;
                                    break;
                                }
                            }
                        }
                        if (comboMatch) el.classList.add('combo-match');

                        if (item.hkCat && activeCategories.has(item.hkCat)) {
                            el.classList.add('cat-highlight');
                            const color = CAT_COLORS[item.hkCat] || '#ffffff';
                            el.style.setProperty('--cat-color', color);
                        } else {
                            el.style.borderLeftColor = 'transparent';
                        }
                        const info = document.createElement('div');
                        info.className = 'cmd-info';
                        info.innerHTML =
                            `<div class="cmd-nm">${item.name}</div>${item.ctx?`<div class="cmd-ctx">${item.ctx}</div>`:''}`;
                        el.appendChild(info);
                        const keys = document.createElement('div');
                        keys.className = 'cmd-keys';
                        for (const kb of item.kbs) {
                            const b = document.createElement('kbd');
                            b.textContent = [...kb.mods, kb.keyId].join('+');
                            keys.appendChild(b);
                        }
                        el.appendChild(keys);
                        el.addEventListener('mouseenter', () => {
                            if (pinned) { clearHL();
                                hlCmd(pinned); } else hlCmd(item);
                        });
                        el.addEventListener('mouseleave', () => {
                            if (!pinned) clearHL();
                            else hlCmd(pinned);
                        });
                        el.addEventListener('click', () => {
                            if (pinned === item) { pinned = null;
                                el.classList.remove('pin');
                                clearHL(); } else { document.querySelectorAll('.cmd.pin').forEach(e => e
                                    .classList.remove('pin'));
                                pinned = item;
                                el.classList.add('pin');
                                hlCmd(item); }
                        });
                        grid.appendChild(el);
                    }
                    si.appendChild(grid);
                    sb.appendChild(si);
                    ss.appendChild(sb);
                    inner.appendChild(ss);
                }
                body.appendChild(inner);
                sec.appendChild(body);
                cm.appendChild(sec);
            }
            const q = document.getElementById('search').value.toLowerCase();
            if (q) {
                document.querySelectorAll('.cmd').forEach(el => {
                    el.style.display = el.dataset.search.includes(q) ? '' : 'none';
                });
            }
            // Also filter by combo search if active
            const comboVal = document.getElementById('comboSearch').value.trim();
            if (comboVal) {
                const normalizedFilter = comboVal.toLowerCase().replace(/\s/g, '');
                document.querySelectorAll('.cmd').forEach(el => {
                    // If it has .combo-match, keep it, otherwise hide
                    if (!el.classList.contains('combo-match')) {
                        el.style.display = 'none';
                    } else {
                        el.style.display = '';
                    }
                });
                // Expand all sections to show matches
                document.querySelectorAll('.race-sec.shut, .sub-sec.shut').forEach(el => el.classList.remove('shut'));
            }
            updateStats();
            updateKeyGlows();
        }

        function updateStats() {
            let totalBinds = 0;
            for (const arr of Object.values(KM)) totalBinds += arr.length;
            document.getElementById('sT').textContent = totalBinds;
            document.getElementById('sK').textContent = Object.keys(KM).length;
            document.getElementById('sA').textContent = Object.keys(AG).length;
        }

        // ─── HIGHLIGHT ──────────────────────────────────────────────────
        function hlCmd(item) {
            clearHL();
            const race = RACES.find(r => r.id === item.race);
            const color = race ? race.c : '#78909c';
            for (const kb of item.kbs) {
                let keyColor = color;
                if (colorizeCommands && item.hkCat && CAT_COLORS[item.hkCat]) {
                    keyColor = CAT_COLORS[item.hkCat];
                }
                glowKey(kb.keyId, keyColor);
                for (const m of kb.mods) glowKey(nk(m), keyColor);
            }
        }

        function glowKey(kid, color) {
            document.querySelectorAll(`[data-key="${kid}"]`).forEach(el => {
                el.classList.add('glow');
                el.style.setProperty('--gc', color);
                el.style.setProperty('--gc4', color + '55');
                el.style.setProperty('--gc2', color + '22');
            });
        }

        function clearHL() {
            document.querySelectorAll('.key.glow').forEach(el => {
                el.classList.remove('glow');
                el.style.removeProperty('--gc');
                el.style.removeProperty('--gc4');
                el.style.removeProperty('--gc2');
            });
        }

        function updateKeyGlows() {
            if (pinned) return;
            clearHL();
            if (activeCategories.size === 0) return;
            const keyCat = {};
            for (const kid of Object.keys(KM)) {
                for (const b of KM[kid]) {
                    if (b.hkCat && activeCategories.has(b.hkCat)) {
                        if (!keyCat[kid]) keyCat[kid] = b.hkCat;
                    }
                }
            }
            for (const [kid, cat] of Object.entries(keyCat)) {
                const color = CAT_COLORS[cat] || '#ffffff';
                glowKey(kid, color);
            }
        }

        // ─── TOOLTIP ────────────────────────────────────────────────────
        function showTip(kid, e) {
            const binds = KM[kid];
            if (!binds || !binds.length) return;
            const tip = document.getElementById('tip');
            let h = `<div class="tip-k">${kid}</div>`;
            const byRace = {};
            for (const b of binds) {
                if (meleeOnly && !b.melee) continue;
                if (!byRace[b.race]) byRace[b.race] = [];
                byRace[b.race].push(b);
            }
            let hasAny = false;
            for (const race of RACES) {
                const items = byRace[race.id];
                if (!items || !items.length) continue;
                hasAny = true;
                h += `<div class="tip-r" style="color:${race.c}">${race.n}</div>`;
                const seen = new Set();
                for (const it of items.slice(0, 10)) {
                    const k = `${it.name}|${it.ctx}`;
                    if (seen.has(k)) continue;
                    seen.add(k);
                    const comboDisplay = it.mods.length ? [...it.mods, it.keyId].join('+') : it.keyId;
                    const catColor = (colorizeCommands && it.hkCat && CAT_COLORS[it.hkCat]) ? CAT_COLORS[it.hkCat] :
                        'transparent';
                    const chip = catColor !== 'transparent' ?
                        `<span class="cat-chip" style="background:${catColor}"></span>` : '';
                    h +=
                    `<div class="tip-c"><span>${chip}${it.name}${it.ctx?` <span class="tc">· ${it.ctx}</span>`:''}</span><span class="tc">${comboDisplay}</span></div>`;
                }
                if (items.length > 10) h +=
                    `<div class="tip-c" style="color:var(--tx-d)">+${items.length-10} more</div>`;
            }
            if (!hasAny) { tip.style.display = 'none'; return; }
            tip.innerHTML = h;
            tip.style.display = 'block';
            const r = e.target.getBoundingClientRect();
            tip.style.left = Math.min(r.left, window.innerWidth - 350) + 'px';
            tip.style.top = (r.bottom + 6) + 'px';
            requestAnimationFrame(() => {
                const tr = tip.getBoundingClientRect();
                if (tr.bottom > window.innerHeight) tip.style.top = (r.top - tr.height - 6) + 'px';
            });
        }

        function hideTip() { document.getElementById('tip').style.display = 'none'; }

        // ─── FILTERS ────────────────────────────────────────────────────
        function renderFilters() {
            const fc = document.getElementById('raceFilters');
            fc.innerHTML = '';
            for (const race of RACES) {
                const f = document.createElement('div');
                f.className = 'filter on';
                f.dataset.race = race.id;
                f.innerHTML = `<span class="dot" style="background:${race.c}"></span>${race.n}`;
                f.onclick = () => {
                    activeRaces.has(race.id) ? activeRaces.delete(race.id) : activeRaces.add(race.id);
                    updFilters();
                };
                fc.appendChild(f);
            }
        }

        function updFilters() {
            document.querySelectorAll('.filter[data-race]').forEach(el => {
                el.classList.toggle('on', activeRaces.has(el.dataset.race));
                el.classList.toggle('off', !activeRaces.has(el.dataset.race));
            });
            document.querySelectorAll('.race-sec').forEach(el => {
                el.style.display = activeRaces.has(el.dataset.race) ? '' : 'none';
            });
        }

        // ─── CATEGORY TOGGLES ──────────────────────────────────────────
        function renderCategoryToggles() {
            const bar = document.getElementById('categoryBar');
            const label = bar.querySelector('.cat-label');
            const clearBtn = bar.querySelector('.cat-clear');
            bar.innerHTML = '';
            bar.appendChild(label);
            for (const cat of CAT_ORDER) {
                if (!CAT_COLORS[cat]) continue;
                const toggle = document.createElement('span');
                toggle.className = 'cat-toggle';
                toggle.dataset.cat = cat;
                const dot = document.createElement('span');
                dot.className = 'cat-dot';
                dot.style.background = CAT_COLORS[cat];
                toggle.appendChild(dot);
                toggle.appendChild(document.createTextNode(cat));
                toggle.addEventListener('click', () => {
                    if (activeCategories.has(cat)) {
                        activeCategories.delete(cat);
                        toggle.classList.remove('active');
                    } else {
                        activeCategories.add(cat);
                        toggle.classList.add('active');
                    }
                    if (pinned) {
                        document.querySelectorAll('.cmd.pin').forEach(el => el.classList.remove('pin'));
                        pinned = null;
                        clearHL();
                    }
                    renderCmds(document.getElementById('comboSearch').value.trim());
                });
                bar.appendChild(toggle);
            }
            bar.appendChild(clearBtn);
            clearBtn.addEventListener('click', () => {
                activeCategories.clear();
                document.querySelectorAll('.cat-toggle').forEach(el => el.classList.remove('active'));
                if (pinned) {
                    document.querySelectorAll('.cmd.pin').forEach(el => el.classList.remove('pin'));
                    pinned = null;
                    clearHL();
                }
                renderCmds(document.getElementById('comboSearch').value.trim());
            });
        }

        // ─── TOGGLE ALL ────────────────────────────────────────────────
        function toggleAll() {
            allCollapsed = !allCollapsed;
            document.querySelectorAll('.race-sec,.sub-sec').forEach(el => el.classList.toggle('shut', allCollapsed));
            document.getElementById('toggleAll').textContent = allCollapsed ? 'Expand All' : 'Collapse All';
        }

        // ─── MELEE TOGGLE ──────────────────────────────────────────────
        function toggleMelee() {
            meleeOnly = !meleeOnly;
            const el = document.getElementById('meleeToggle');
            el.classList.toggle('active', meleeOnly);
            renderCmds(document.getElementById('comboSearch').value.trim());
            const q = document.getElementById('search').value.toLowerCase();
            if (q) {
                document.querySelectorAll('.cmd').forEach(el2 => {
                    el2.style.display = el2.dataset.search.includes(q) ? '' : 'none';
                });
            }
            updFilters();
        }

        // ─── COLORIZE TOGGLE ───────────────────────────────────────────
        function toggleColorize() {
            colorizeCommands = !colorizeCommands;
            const el = document.getElementById('colorizeToggle');
            el.classList.toggle('active', colorizeCommands);
            if (pinned) {
                clearHL();
                hlCmd(pinned);
            }
            updateKeyGlows();
        }

        // ─── COMBO SEARCH ──────────────────────────────────────────────
        function handleComboSearch() {
            const val = document.getElementById('comboSearch').value.trim();
            renderCmds(val);
        }

        // ─── INIT ──────────────────────────────────────────────────────
        function init() {
            const binds = parse();
            build(binds);
            renderKB();
            renderCmds('');
            renderFilters();
            renderCategoryToggles();

            document.getElementById('search').addEventListener('input', e => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll('.cmd').forEach(el => {
                    el.style.display = el.dataset.search.includes(q) ? '' : 'none';
                });
                // Re-apply combo filter if active
                const comboVal = document.getElementById('comboSearch').value.trim();
                if (comboVal) {
                    const normalizedFilter = comboVal.toLowerCase().replace(/\s/g, '');
                    document.querySelectorAll('.cmd').forEach(el => {
                        if (!el.classList.contains('combo-match')) {
                            el.style.display = 'none';
                        } else {
                            el.style.display = '';
                        }
                    });
                }
            });

            document.getElementById('toggleAll').addEventListener('click', toggleAll);
            document.getElementById('meleeToggle').addEventListener('click', toggleMelee);
            document.getElementById('colorizeToggle').addEventListener('click', toggleColorize);
            document.getElementById('comboSearch').addEventListener('input', handleComboSearch);
            document.getElementById('comboClear').addEventListener('click', () => {
                document.getElementById('comboSearch').value = '';
                renderCmds('');
            });

            document.getElementById('meleeToggle').classList.add('active');
            document.getElementById('colorizeToggle').classList.add('active');

            updateStats();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
